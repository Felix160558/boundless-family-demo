<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c16">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A meeting space for teachers, parents and students with a shared sample learning report.">
  <title>Meeting room · Boundless Classroom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23080c16'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='46' fill='%239581ff'%3E∞%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./meeting.css?v=meeting-minimal-4">
  <script type="module" src="./meeting.js?v=meeting-minimal-4"></script>
</head>
<body>
  <div id="meeting-scene" class="scene" aria-label="A three-seat meeting space with a shared learning report"></div>
  <div class="scene-shade" aria-hidden="true"></div>
  <header class="meeting-header">
    <a class="brand" href="./reservation.html" aria-label="Back to the Common Room"><span class="brand-mark" aria-hidden="true">∞</span><span class="brand-name">BOUNDLESS<small>CLASSROOM</small></span></a>
    <nav aria-label="Meeting navigation"><a class="text-button" href="./reservation.html" id="back-to-lounge">Exit</a></nav>
  </header>

  <main class="meeting-layout">
    <section class="connection-message" aria-live="polite"><span id="connection-dot" aria-hidden="true"></span><p id="connection-status">Preparing the room…</p><button type="button" id="retry-join" hidden>Retry</button></section>
  </main>

  <footer class="meeting-dock glass" id="meeting-dock" aria-label="Meeting controls">
    <div class="page-controls" aria-label="Shared slides">
      <button id="previous-page" type="button" aria-label="Previous slide" title="Previous slide">‹</button>
      <span id="page-number" aria-live="polite">01 / 04</span>
      <button id="next-page" type="button" aria-label="Next slide" title="Next slide">›</button>
    </div>
    <span class="dock-separator" aria-hidden="true"></span>
    <button class="dock-button" id="invite-people" type="button">Invite</button>
    <button class="dock-button" id="microphone" type="button" aria-pressed="false" hidden><span id="microphone-label">Mic</span></button>
    <button class="dock-button" id="resume-audio" type="button" hidden>Resume audio</button>
    <button class="dock-button xr-button" id="enter-vr" type="button"><span id="vr-label">VR</span></button>
  </footer>

  <dialog class="invite-dialog" id="invite-dialog" aria-labelledby="invite-title"><header><div><p class="eyebrow">INVITATIONS</p><h2 id="invite-title">Invite parent and student</h2></div><button class="close-button" id="close-invite" type="button" aria-label="Close invitations">×</button></header><p class="dialog-copy" id="invite-description"></p><div id="invite-links"></div><p class="copy-feedback" id="copy-feedback" role="status"></p></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript">Enable JavaScript to enter the meeting space. Teacher profiles and reports are demo content.</p></noscript>
</body>
</html>
